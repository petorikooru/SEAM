[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kai-bridge-inspection"
version = "5.2.0"
description = "PySide6/QML bridge inspection dashboard driven by normalized Node-RED WebSocket telemetry"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Proprietary - supplied project assets retain their original ownership"}
authors = [{name = "Project Team"}]
dependencies = [
    "PySide6>=6.8,<7",
    "XlsxWriter>=3.2,<4",
]

[project.optional-dependencies]
packaging = ["pyinstaller>=6.10,<7"]
legacy-mqtt = ["paho-mqtt>=2.1,<3", "protobuf>=3.20,<7"]
influx = ["influxdb-client>=1.48,<2"]
dev = [
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "mypy>=1.14,<2",
    "ruff>=0.9,<1",
    "paho-mqtt>=2.1,<3",
    "protobuf>=3.20,<7",
]

[project.scripts]
kai-bridge-inspection = "kai_bridge_inspection.application.main:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kai_bridge_inspection = [
    "qml/**/*.qml",
    "qml/qmldir",
    "qml/assets/*.svg", "qml/assets/icons/lucide/*.svg", "qml/assets/icons/lucide/LICENSE",
    "qml/assets/*.ico",
    "qml/assets/sensors/*.jpg",
    "qml/i18n/*.js",
    "qml/i18n/*.json",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
show_error_codes = true
mypy_path = "src"
exclude = ["src/kai_bridge_inspection/sparkplug/sparkplug_b_pb2.py"]

[[tool.mypy.overrides]]
module = ["PySide6.*", "paho.*", "google.protobuf.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 110
extend-exclude = ["src/kai_bridge_inspection/sparkplug/sparkplug_b_pb2.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]
